# Top-level nginx config for the single-container image. Everything writable lives in /tmp, so nginx
# runs as the unprivileged app user. The site itself is frontend/nginx.conf, adapted at build time.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    sendfile on;
    keepalive_timeout 65;

    client_body_temp_path /tmp/nginx-client;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    # Render's proxy appends the visitor's address to X-Forwarded-For, so its last entry is the real
    # one, and anything earlier may be forged by the client. Non-recursive takes exactly that entry.
    # The backend rate-limits logins per address, which would otherwise see only Render's proxy.
    set_real_ip_from 0.0.0.0/0;
    set_real_ip_from ::/0;
    real_ip_header X-Forwarded-For;
    real_ip_recursive off;

    include /tmp/spotlight-site.conf;
}
