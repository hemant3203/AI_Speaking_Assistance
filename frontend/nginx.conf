# Spotlight frontend: serves the SPA and proxies /api/ (REST and the live WebSocket) to the backend.

# Upgrade only when the client asked for it, so plain REST requests stay normal HTTP.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# One Cache-Control per path class. Declared here, and added once at server level, because an
# add_header inside a location would silently drop every security header inherited from the server.
# Keyed on status too: only a real asset may be cached as immutable. A 404 for a hashed file must
# not be, because a later build can bring back the same hash, and a cached 404 would then break
# that page for a year, even across reloads. Regexes are tried in order, and the first match wins.
map "$status:$uri" $spotlight_cache_control {
    default                 "no-cache";
    ~^\d+:/api/             "";
    ~^(200|304):/assets/    "public, max-age=31536000, immutable";
    ~^\d+:/assets/          "no-store";
}

server {
    listen 1201;
    listen [::]:1201;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The published port may differ from the container port, so never build absolute redirects.
    absolute_redirect off;
    server_tokens off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header Cache-Control $spotlight_cache_control always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' ws: wss:; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; worker-src 'self' blob:; script-src 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "microphone=(self), camera=()" always;

    location /api/ {
        # Resolve at request time through Docker's DNS: nginx still starts if the backend is
        # down, and it follows the backend to a new IP after a restart.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $spotlight_backend http://backend:1200;
        proxy_pass $spotlight_backend;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A live session can run for 600 s, with long silences while the user speaks or scores wait.
        proxy_read_timeout 1600s;
        proxy_send_timeout 1600s;
        proxy_buffering off;
    }

    # Hashed assets either exist or are a real 404. They must never fall back to the SPA shell.
    location /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
